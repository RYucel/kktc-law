[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kktc-law"
version = "0.1.0"
description = "KKTC mevzuatını deterministik bir Git külliyatı olarak kodlayan araçlar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kktc-law" }]
keywords = ["law", "legislation", "trnc", "kktc", "git", "deterministic"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Legal Industry",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.2,<7",
  "tenacity>=8.3,<10",
  "typer>=0.12,<1",
  "mcp>=1.2,<2",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[project.scripts]
kktc-law = "tools.law:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
